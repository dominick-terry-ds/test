<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Maintenance Form</title>
    <link rel="icon" href="./public/favicon.png" />
    <style>
      @font-face {
        font-family: 'DS Indigo Medium';
        src: url('./public/fonts/DS_Indigo-Medium.woff2') format('woff2');
        font-style: normal;
        font-weight: 500;
      }

      @font-face {
        font-family: 'DS Indigo Regular';
        src: url('./public/fonts/DS_Indigo-Regular.woff2') format('woff2');
        font-style: normal;
        font-weight: 400;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: #292825;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #292825;
      }

      .panel {
        width: 100%;
        max-width: 264px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        padding: 16px;
        border: 1px solid #fff;
        border-radius: 8px;
        background: #f9f6fc;
        box-shadow: 0 16px 24px rgba(55, 51, 46, 0.3);
        backdrop-filter: blur(5px);
      }

      .header {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .header-icon {
        width: 12px;
        height: 12px;
        flex: none;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        color: #130032;
        font-family: 'DS Indigo Medium', sans-serif;
        font-size: 14px;
        font-weight: 500;
        line-height: normal;
        white-space: nowrap;
      }

      .section {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        padding: 8px;
        border: 1px dashed rgba(19, 0, 50, 0.1);
        border-radius: 4px;
      }

      .field {
        gap: 4px;
      }

      .purpose {
        gap: 8px;
      }

      .label {
        width: 100%;
        padding: 2px 0;
        color: #130032;
        font-family: 'DS Indigo Regular', sans-serif;
        font-size: 8px;
        font-weight: 400;
        line-height: 1.4;
        white-space: nowrap;
      }

      .input-placeholder {
        width: 100%;
        height: 20px;
        border-radius: 2px;
        background: rgba(19, 0, 50, 0.05);
      }

      .options {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .option {
        width: 100%;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 4px;
        color: rgba(19, 0, 50, 0.7);
        font-family: 'DS Indigo Regular', sans-serif;
        font-size: 8px;
        font-weight: 400;
        line-height: 1.4;
      }

      .control-wrap {
        position: relative;
        width: 15.745px;
        height: 15.745px;
        flex: none;
      }

      .control {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 13.121px;
        height: 13.121px;
        transform: translate(-50%, -50%);
        border: 1px solid rgba(19, 0, 50, 0.2);
        border-radius: 2.624px;
      }

      .generating-row {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .spark-wrap {
        position: relative;
        width: 12px;
        height: 12px;
        flex: none;
      }

      .spark {
        position: absolute;
        top: -4.542px;
        left: -6.545px;
        width: 25.0904px;
        height: 25.0852px;
        max-width: none;
      }

      .generating {
        font-family: 'DS Indigo Regular', sans-serif;
        font-size: 7px;
        font-weight: 400;
        line-height: normal;
        white-space: nowrap;
        color: transparent;
        background: linear-gradient(
          -88.303deg,
          rgba(19, 0, 50, 0.1) 0.188%,
          rgba(19, 0, 50, 0.6) 69.175%
        );
        background-clip: text;
        -webkit-background-clip: text;
      }
    </style>
  </head>
  <body>
    <main class="panel" aria-labelledby="form-title">
      <header class="header">
        <img
          class="header-icon"
          src="./public/assets/c11e7.svg"
          alt=""
        />
        <h1 id="form-title">Account Maintenance Form</h1>
      </header>

      <section class="section field" aria-label="Primary applicant">
        <p class="label">Name of Primary Applicant/Custodian</p>
        <div class="input-placeholder" aria-hidden="true"></div>
      </section>

      <section class="section purpose" aria-labelledby="purpose-label">
        <p class="label" id="purpose-label">Account Purpose</p>
        <div class="options">
          <div class="option">
            <span class="control-wrap"><span class="control"></span></span>
            <span>Personal Banking</span>
          </div>
          <div class="option">
            <span class="control-wrap"><span class="control"></span></span>
            <span>Investments/Brokerage</span>
          </div>
          <div class="option">
            <span class="control-wrap"><span class="control"></span></span>
            <span>Retirement (IRA)</span>
          </div>
          <div class="option">
            <span class="control-wrap"><span class="control"></span></span>
            <span>Business Operations</span>
          </div>
          <div class="option">
            <span class="control-wrap"><span class="control"></span></span>
            <span>Savings / Money Market</span>
          </div>
          <div class="option">
            <span class="control-wrap"><span class="control"></span></span>
            <span>Certificate of Deposit (CD)</span>
          </div>
        </div>
      </section>

      <section class="section" aria-label="Generation status">
        <div class="generating-row">
          <span class="spark-wrap" aria-hidden="true">
            <img
              class="spark"
              src="./public/assets/1c0ae.svg"
              alt=""
            />
          </span>
          <p class="generating">Generating...</p>
        </div>
      </section>
    </main>
  </body>
</html>
